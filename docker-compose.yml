version: '3'
services:
    app:
        build: .
        ports:
            - '3000:3000'
        env_file:
            - .env
        volumes:
            - ./:/usr/app/src:ro
        depends_on:
            - mongo
    mongo:
        image: mongo
        ports:
            - '27017:27017'
        volumes:
            - mongo-data:/data/db

volumes:
    mongo-data:
